name: Manual Build Valkey

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Valkey Version'
        required: true
        default: "9.1.0"
        type: string
      make_latest:
        description: 'Mark as Latest Release'
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        default: false
        type: boolean

jobs:
  build-valkey:
    uses: ./.github/workflows/build-valkey.yml
    with:
      release_version: ${{ inputs.tag_name }}
      make_latest: ${{ inputs.make_latest }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
